<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Player - Preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0f0f0f;color:#fff;display:flex;height:100vh;overflow:hidden}
  .sidebar{width:260px;background:#181818;border-right:1px solid #222;padding:15px;overflow-y:auto}
  .sidebar h2{font-size:16px;margin-bottom:15px}
  .folder{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:5px;background:#222}
  .folder:hover{background:#333}
  .folder.active{background:#e50914}
  .folder span{font-size:13px;color:#aaa;display:block}
  .main{flex:1;overflow-y:auto;padding:20px}
  .main h1{font-size:22px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:#1e1e1e;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #222;position:relative;transition:.2s;user-select:none;-webkit-touch-callout:none}
  .card:hover{transform:scale(1.03);border-color:#555;z-index:2}
  .thumb-wrap{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
  .thumb-wrap img, .thumb-wrap video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .thumb-wrap video{display:none}
  .card.previewing .thumb-wrap video{display:block}
  .card.previewing .thumb-wrap img{opacity:0}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:20px;font-size:11px;z-index:3}
  .loading{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);padding:3px 7px;border-radius:10px;font-size:11px;display:none;z-index:3}
  .card.previewing .loading{display:block}
  .info{padding:12px}
  .info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info p{font-size:12px;color:#888;margin-top:4px}
  .player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;padding:20px}
  .player.show{display:flex}
  .player video,.player img{max-width:90%;max-height:80vh;border-radius:12px}
  .close{position:absolute;top:20px;right:25px;font-size:30px;cursor:pointer}
</style>
</head>
<body>

<div class="sidebar">
  <h2>📁 Pastas</h2>
  <div id="folders"></div>
</div>

<div class="main">
  <h1 id="currentFolder">Todos</h1>
  <p style="color:#888;font-size:13px;margin-bottom:15px">💡 PC: passa o mouse por cima pra ver o preview &nbsp; | &nbsp; Celular: SEGURA o dedo em cima</p>
  <div class="grid" id="grid"></div>
</div>

<div class="player" id="player">
  <div class="close" onclick="closePlayer()">✕</div>
  <video id="videoEl" controls autoplay style="display:none"></video>
  <img id="imgEl" style="display:none">
  <div style="margin-top:15px;font-size:18px" id="playerTitle"></div>
</div>

<script>
const DADOS = [
  { titulo: "Big Buck Bunny", pasta: "Filmes / Ação", capa: "https://via.placeholder.com/640x360/222/fff?text=CAPA", url: "https://u.pcloud.link/publink/show?code=XZKYA2JZwNpl1VFuRzjj0JLj8LnB87T5SKdy", tipo: "video" },
  { titulo: "Elephants Dream", pasta: "Filmes", capa: "https://via.placeholder.com/640x360/333/fff?text=CAPA2", url: "https://u.pcloud.link/publink/show?code=XZsYA2JZ8qG6pY5rFyy1Y2qxo8PEBVHlz4hX", tipo: "video" },
  { titulo: "Minha Foto", pasta: "Fotos", capa: "https://picsum.photos/640/360", url: "https://picsum.photos/1200/800", tipo: "imagem" },
];

let pastaAtual = "Todos";
const gridEl = document.getElementById('grid');

function renderPastas(){
  const el = document.getElementById('folders'); el.innerHTML="";
  let pastas = ["Todos", ...new Set(DADOS.map(d=>d.pasta))];
  pastas.forEach(p=>{
    let count = p==="Todos" ? DADOS.length : DADOS.filter(d=>d.pasta===p).length;
    let div = document.createElement('div');
    div.className='folder'+(p===pastaAtual?' active':'');
    div.innerHTML=`📁 ${p} <span>${count} itens</span>`;
    div.onclick=()=>{pastaAtual=p; renderPastas(); renderGrid();}
    el.appendChild(div);
  });
}

function renderGrid(){
  document.getElementById('currentFolder').innerText = pastaAtual;
  gridEl.innerHTML="";
  let filtrados = pastaAtual==="Todos" ? DADOS : DADOS.filter(d=>d.pasta===pastaAtual);
  filtrados.forEach(item=>{
    let card = document.createElement('div');
    card.className='card';
    // Só cria video de preview se for video
    let previewHtml = item.tipo==='video' ? `<video muted loop playsinline preload="none" src="${item.url}"></video>` : '';
    card.innerHTML=`
      <div class="thumb-wrap">
        <img src="${item.capa}">
        ${previewHtml}
        <div class="badge">${item.tipo==='video'?'▶ VÍDEO':'🖼️ IMAGEM'}</div>
        <div class="loading">▶ Tocando preview...</div>
      </div>
      <div class="info"><b>${item.titulo}</b><p>${item.pasta}</p></div>
    `;

    let video = card.querySelector('video');
    let timer = null;
    let isHolding = false;

    function startPreview(){
      if(!video) return;
      card.classList.add('previewing');
      video.currentTime = 0;
      video.play().catch(()=>{});
    }
    function stopPreview(){
      if(!video) return;
      card.classList.remove('previewing');
      video.pause();
    }

    // --- PC: PASSAR O MOUSE ---
    card.addEventListener('mouseenter', ()=>{
      // espera 400ms pra não ficar piscando quando passa rápido
      timer = setTimeout(startPreview, 400);
    });
    card.addEventListener('mouseleave', ()=>{
      clearTimeout(timer);
      stopPreview();
    });

    // --- CELULAR: SEGURAR ---
    card.addEventListener('touchstart', (e)=>{
      isHolding = true;
      timer = setTimeout(()=>{
        if(isHolding) startPreview();
      }, 400);
    }, {passive:true});
    card.addEventListener('touchend', ()=>{
      isHolding = false;
      clearTimeout(timer);
      // se tava em preview, para. Se não tava, foi um clique normal
      if(card.classList.contains('previewing')){
        stopPreview();
      } else {
        openPlayer(item);
      }
    });
    card.addEventListener('touchmove', ()=>{
      isHolding = false;
      clearTimeout(timer);
      stopPreview();
    });

    // Clique no PC abre o player cheio
    card.addEventListener('click', (e)=>{
      // evita abrir 2x no celular
      if(e.pointerType === 'touch') return;
      openPlayer(item);
    });

    gridEl.appendChild(card);
  });
}

function openPlayer(item){
  const p=document.getElementById('player');
  const v=document.getElementById('videoEl');
  const img=document.getElementById('imgEl');
  document.getElementById('playerTitle').innerText=item.titulo;
  p.classList.add('show');
  if(item.tipo==='video'){
    v.style.display='block'; img.style.display='none';
    v.src=item.url; v.play();
  } else {
    v.style.display='none'; v.pause(); img.style.display='block';
    img.src=item.url;
  }
}
function closePlayer(){
  document.getElementById('player').classList.remove('show');
  const v=document.getElementById('videoEl'); v.pause(); v.src="";
}
renderPastas(); renderGrid();
</script>
</body>
</html>
