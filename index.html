<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Player</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0f0f0f;color:#fff;display:flex;height:100vh;overflow:hidden}
  .sidebar{width:260px;min-width:260px;background:#181818;border-right:1px solid #222;padding:15px;overflow-y:auto}
  .sidebar h2{font-size:16px;margin-bottom:15px}
  .folder{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:5px;background:#222;white-space:nowrap}
  .folder:hover{background:#333}
  .folder.active{background:#e50914}
  .folder span{font-size:13px;color:#aaa;display:block}
  .main{flex:1;overflow-y:auto;padding:20px;min-width:0}
  .main h1{font-size:22px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:#1e1e1e;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #222;position:relative;transition:.2s;user-select:none}
  .card:hover{transform:scale(1.02);border-color:#555}
  .thumb-wrap{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
  .thumb-wrap video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#000}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:20px;font-size:11px;z-index:3;pointer-events:none}
  .loading{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);padding:3px 7px;border-radius:10px;font-size:11px;display:none;z-index:3;pointer-events:none}
  .card.previewing .loading{display:block}
  .info{padding:12px}
  .info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info p{font-size:12px;color:#888;margin-top:4px}
  .player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;padding:20px}
  .player.show{display:flex}
  .player video,.player img{max-width:95%;max-height:80vh;border-radius:12px;width:100%}
  .close{position:absolute;top:20px;right:25px;font-size:30px;cursor:pointer;z-index:100}

  /* CORREÇÃO CELULAR - categorias não ficam mais no meio */
  @media (max-width: 768px){
    body{flex-direction:column}
    .sidebar{width:100%;min-width:0;height:auto;max-height:120px;border-right:none;border-bottom:1px solid #222;padding:10px;overflow-y:hidden;overflow-x:auto;white-space:nowrap}
    .sidebar h2{display:none}
    #folders{display:flex;gap:8px}
    .folder{display:inline-block;margin-bottom:0}
    .folder span{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .main{padding:12px}
  }
</style>
</head>
<body>

<div class="sidebar">
  <h2>📁 Pastas</h2>
  <div id="folders"></div>
</div>

<div class="main">
  <h1 id="currentFolder">Todos</h1>
  <p style="color:#888;font-size:13px;margin-bottom:15px">PC: passa o mouse = preview &nbsp;|&nbsp; Celular: SEGURA = preview, TOQUE = abre</p>
  <div class="grid" id="grid"></div>
</div>

<div class="player" id="player">
  <div class="close" onclick="closePlayer()">✕</div>
  <video id="videoEl" controls autoplay playsinline style="display:none"></video>
  <img id="imgEl" style="display:none">
  <div style="margin-top:15px;font-size:18px" id="playerTitle"></div>
</div>

<script>
// CONVERTE LINK PCLOUD PAGE -> LINK DIRETO DE VÍDEO
function converterPcloud(url){
  if(!url.includes('pcloud.link')) return url;
  // pega o code=XXXX
  let m = url.match(/code=([^&]+)/);
  if(!m) return url;
  let code = m[1];
  // API oficial do pCloud que devolve o arquivo direto
  return `https://api.pcloud.com/getpublinkdownload?code=${code}`;
}

const DADOS = [
  // AGORA NÃO PRECISA DE CAPA, SÓ TITULO, PASTA E URL
  { titulo: "Video 1", pasta: "Filmes / Ação", url: "https://u.pcloud.link/publink/show?code=XZKYA2JZwNpl1VFuRzjj0JLj8LnB87T5SKdy", tipo: "video" },
  { titulo: "Video 2", pasta: "Filmes", url: "https://u.pcloud.link/publink/show?code=XZsYA2JZ8qG6pY5rFyy1Y2qxo8PEBVHlz4hX", tipo: "video" },
  { titulo: "Minha Foto", pasta: "Fotos", url: "https://picsum.photos/1200/800", tipo: "imagem" },
];

let pastaAtual = "Todos";
const gridEl = document.getElementById('grid');

function renderPastas(){
  const el = document.getElementById('folders'); el.innerHTML="";
  let pastas = ["Todos", ...new Set(DADOS.map(d=>d.pasta))];
  pastas.forEach(p=>{
    let count = p==="Todos" ? DADOS.length : DADOS.filter(d=>d.pasta===p).length;
    let div = document.createElement('div');
    div.className='folder'+(p===pastaAtual?' active':'');
    div.innerHTML=`📁 ${p} <span>${count} itens</span>`;
    div.onclick=()=>{pastaAtual=p; renderPastas(); renderGrid();}
    el.appendChild(div);
  });
}

function renderGrid(){
  document.getElementById('currentFolder').innerText = pastaAtual;
  gridEl.innerHTML="";
  let filtrados = pastaAtual==="Todos" ? DADOS : DADOS.filter(d=>d.pasta===pastaAtual);
  filtrados.forEach(item=>{
    let urlFinal = item.tipo==='video' ? converterPcloud(item.url) : item.url;
    let card = document.createElement('div');
    card.className='card';

    if(item.tipo==='video'){
      // CAPA AUTOMÁTICA: o próprio vídeo, preload metadata pega o 1º frame
      card.innerHTML=`
        <div class="thumb-wrap">
          <video muted loop playsinline preload="metadata" src="${urlFinal}#t=0.1"></video>
          <div class="badge">▶ VÍDEO</div>
          <div class="loading">▶ Preview...</div>
        </div>
        <div class="info"><b>${item.titulo}</b><p>${item.pasta}</p></div>
      `;
    } else {
      card.innerHTML=`
        <div class="thumb-wrap">
          <img src="${urlFinal}" style="width:100%;height:100%;object-fit:cover">
          <div class="badge">🖼️ IMAGEM</div>
        </div>
        <div class="info"><b>${item.titulo}</b><p>${item.pasta}</p></div>
      `;
    }

    let video = card.querySelector('video');
    let timer = null;
    let isHolding = false;

    function startPreview(){
      if(!video) return;
      card.classList.add('previewing');
      video.currentTime = 0;
      video.play().catch(()=>{});
    }
    function stopPreview(){
      if(!video) return;
      card.classList.remove('previewing');
      video.pause();
      // volta pro frame inicial pra virar capa de novo
      video.currentTime = 0.1;
    }

    card.addEventListener('mouseenter', ()=>{ timer = setTimeout(startPreview, 350); });
    card.addEventListener('mouseleave', ()=>{ clearTimeout(timer); stopPreview(); });

    card.addEventListener('touchstart', ()=>{
      isHolding = true;
      timer = setTimeout(()=>{ if(isHolding) startPreview(); }, 400);
    }, {passive:true});
    card.addEventListener('touchend', ()=>{
      isHolding = false; clearTimeout(timer);
      if(card.classList.contains('previewing')){ stopPreview(); }
      else { openPlayer(item, urlFinal); }
    });
    card.addEventListener('touchmove', ()=>{ isHolding=false; clearTimeout(timer); stopPreview(); });
    card.addEventListener('click', (e)=>{ if(e.pointerType==='touch') return; openPlayer(item, urlFinal); });

    gridEl.appendChild(card);
  });
}

function openPlayer(item, urlFinal){
  if(!urlFinal) urlFinal = item.tipo==='video' ? converterPcloud(item.url) : item.url;
  const p=document.getElementById('player');
  const v=document.getElementById('videoEl');
  const img=document.getElementById('imgEl');
  document.getElementById('playerTitle').innerText=item.titulo;
  p.classList.add('show');
  if(item.tipo==='video'){
    v.style.display='block'; img.style.display='none';
    v.src=urlFinal; v.play();
  } else {
    v.style.display='none'; v.pause(); img.style.display='block';
    img.src=urlFinal;
  }
}
function closePlayer(){
  document.getElementById('player').classList.remove('show');
  const v=document.getElementById('videoEl'); v.pause(); v.src="";
}
renderPastas(); renderGrid();
</script>
</body>
</html>
